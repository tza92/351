<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161618">
  <title>iPhone 17 Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #161618; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage { display: grid; place-items: center; width: 100%; height: 100dvh; overflow: hidden; }
    .device-space { position: relative; }
    .iphone {
      position: absolute; top: 0; left: 0;
      width: 430px; height: 900px; padding: 13px 14px;
      border-radius: 82px;
      background: linear-gradient(100deg, #535358, #151517 3%, #09090b 50%, #171719 97%, #535358);
      box-shadow: 0 0 0 1px #222225, inset 0 0 0 1px #77777d,
        inset 0 0 0 3px #35353a, inset 0 0 0 5px #080809,
        0 24px 65px #0007;
      transform-origin: top left;
    }
    .screen {
      --safe-top: 62px;
      --status-height: 54px;
      --safe-bottom: 34px;
      position: relative; display: grid;
      grid-template-rows: var(--safe-top) minmax(0, 1fr) var(--safe-bottom);
      width: 402px; height: 874px;
      overflow: hidden; border-radius: 68px; background: #fff; color: #111;
    }
    .safe-area-top, .safe-area-bottom { position: relative; }
    .app-content { min-height: 0; overflow: auto; }
    .status-bar {
      position: absolute; inset: 0 0 auto; height: var(--status-height);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 29px 0 36px; font-size: 16px; font-weight: 600;
      letter-spacing: -.3px; user-select: none;
    }
    .island {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; border-radius: 24px; background: #080808;
    }
    .island::after {
      content: ""; position: absolute; top: 12px; right: 13px;
      width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle at 65% 35%, #182b48, #0b111c 45%, #08090d 70%);
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { display: block; width: 17px; height: 13px; fill: currentColor; }
    .battery { position: relative; width: 25px; height: 12px; padding: 1.5px; border: 1px solid #9998; border-radius: 4px; }
    .battery::before { content: ""; display: block; height: 100%; border-radius: 2px; background: currentColor; }
    .battery::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; opacity: .5; }
    .home-indicator { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 4px; background: currentColor; }
    .button { position: absolute; left: -4px; width: 4px; border-radius: 3px; background: linear-gradient(90deg, #1b1b1d, #65656a, #29292c); }
    .action { top: 184px; height: 40px; }
    .volume-up { top: 255px; height: 65px; }
    .volume-down { top: 339px; height: 65px; }
    .power { left: auto; right: -4px; top: 278px; height: 104px; }
    .camera { left: auto; right: -2px; top: 570px; height: 48px; width: 2px; }
  </style>
</head>
<body>
  <main class="stage" aria-label="iPhone 17 preview">
    <div class="device-space">
      <div class="iphone">
        <span class="button action" aria-hidden="true"></span>
        <span class="button volume-up" aria-hidden="true"></span>
        <span class="button volume-down" aria-hidden="true"></span>
        <span class="button power" aria-hidden="true"></span>
        <span class="button camera" aria-hidden="true"></span>
        <div class="screen" aria-label="Blank iPhone screen">
          <div class="safe-area-top">
          <div class="status-bar">
            <span>9:41</span>
            <span class="island" aria-hidden="true"></span>
            <span class="status-icons">
              <svg viewBox="0 0 18 13" role="img" aria-label="Cellular signal"><rect x="0" y="9" width="3" height="4" rx=".7"/><rect x="5" y="6" width="3" height="7" rx=".7"/><rect x="10" y="3" width="3" height="10" rx=".7"/><rect x="15" width="3" height="13" rx=".7"/></svg>
              <svg viewBox="0 0 18 14" role="img" aria-label="Wi-Fi"><path d="M1 4Q9-2 17 4M4 7Q9 3 14 7M7 10Q9 8.5 11 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="9" cy="12" r="1.4"/></svg>
              <span class="battery" role="img" aria-label="Battery full"></span>
            </span>
          </div>
          </div>
          <div class="app-content"></div>
          <div class="safe-area-bottom">
            <div class="home-indicator" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const device = document.querySelector('.iphone');
    const space = document.querySelector('.device-space');
    const stage = document.querySelector('.stage');
    function fitPhone() {
      const width = device.offsetWidth;
      const height = device.offsetHeight;
      const scale = Math.max(0.05, Math.min((stage.clientWidth - 40) / width, (stage.clientHeight - 48) / height, 1));
      device.style.transform = `scale(${scale})`;
      space.style.width = `${width * scale}px`;
      space.style.height = `${height * scale}px`;
    }
    new ResizeObserver(fitPhone).observe(stage);
    fitPhone();
  </script>
</body>
</html>
