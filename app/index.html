<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Today · Nutrition</title>
    <link rel="stylesheet" href="src/styles.css">
    <script src="src/main.js" defer></script>
  </head>
  <body>
    <!-- Google Material Symbols (Apache 2.0), plus the custom bottom navigation icons. -->
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="plus" viewBox="0 -960 960 960"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></symbol>
      <symbol id="home" viewBox="0 0 32 32"><path d="m5 13 11-9 11 9v16h-8v-10h-6v10H5Z"/></symbol>
      <symbol id="menu" viewBox="0 0 32 32"><rect x="7" y="4" width="20" height="25" rx="2"/><path d="M4 9h5M4 16h5M4 23h5M14 8v7m4-7v7m-4-4h4m-2 4v10m7-17-2 8h2v9"/></symbol>
      <symbol id="track" viewBox="0 0 32 32"><path d="M5 28V12h5v16Zm9 0V4h5v24Zm9 0V18h5v10Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="social" viewBox="0 0 32 32"><path d="m5 28 7-19 12 12ZM9 18l9 7M14 5l3 5m7-7-4 7m9 2-7 3M22 19l6 2M21 6l1-3M28 7l2 1"/></symbol>
      <symbol id="meal" viewBox="0 -960 960 960"><path d="M533-440q-32-45-84.5-62.5T340-520q-56 0-108.5 17.5T147-440h386ZM40-360q0-109 91-174.5T340-600q118 0 209 65.5T640-360H40Zm0 160v-80h600v80H40ZM720-40v-80h56l56-560H450l-10-80h200v-160h80v160h200L854-98q-3 25-22 41.5T788-40h-68Zm0-80h56-56ZM80-40q-17 0-28.5-11.5T40-80v-40h600v40q0 17-11.5 28.5T600-40H80Zm260-400Z"/></symbol>
      <symbol id="drink" viewBox="0 -960 960 960"><path d="M279-80q-31 0-53.5-20T200-151l-80-729h720l-80 729q-3 31-25.5 51T681-80H279Zm-8-160 9 80h400l9-80H271Zm-8-80h435l52-480H210l53 480Zm8 160h418-418Z"/></symbol>
      <symbol id="cookie" viewBox="0 -960 960 960"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-75 29-147t81-128.5q52-56.5 125-91T475-881q21 0 43 2t45 7q-9 45 6 85t45 66.5q30 26.5 71.5 36.5t85.5-5q-26 59 7.5 113t99.5 56q1 11 1.5 20.5t.5 20.5q0 82-31.5 154.5t-85.5 127q-54 54.5-127 86T480-80Zm-60-480q25 0 42.5-17.5T480-620q0-25-17.5-42.5T420-680q-25 0-42.5 17.5T360-620q0 25 17.5 42.5T420-560Zm-80 200q25 0 42.5-17.5T400-420q0-25-17.5-42.5T340-480q-25 0-42.5 17.5T280-420q0 25 17.5 42.5T340-360Zm260 40q17 0 28.5-11.5T640-360q0-17-11.5-28.5T600-400q-17 0-28.5 11.5T560-360q0 17 11.5 28.5T600-320ZM480-160q122 0 216.5-84T800-458q-50-22-78.5-60T683-603q-77-11-132-66t-68-132q-80-2-140.5 29t-101 79.5Q201-644 180.5-587T160-480q0 133 93.5 226.5T480-160Zm0-324Z"/></symbol>
      <symbol id="chef" viewBox="0 -960 960 960"><path d="M360-400h80v-200h-80v200Zm-160-60q-46-23-73-66.5T100-621q0-75 51.5-127T278-800q12 0 24.5 2t24.5 5q25-41 65-64t88-23q48 0 88 23t65 64q12-3 24-5t25-2q75 0 126.5 52T860-621q0 51-27 94.5T760-460v220H200v-220Zm320 60h80v-200h-80v200Zm-240 80h400v-189l44-22q26-13 41-36.5t15-52.5q0-42-28.5-71T682-720q-11 0-20 2t-19 5l-47 13-31-52q-14-23-36.5-35.5T480-800q-26 0-48.5 12.5T395-752l-31 52-48-13q-10-2-19.5-4.5T277-720q-41 0-69 29t-28 71q0 29 15 52.5t41 36.5l44 22v189Zm-80 80h80v80h400v-80h80v160H200v-160Zm280-80Z"/></symbol>
      <symbol id="qr" viewBox="0 -960 960 960"><path d="M120-520v-320h320v320H120Zm80-80h160v-160H200v160Zm-80 480v-320h320v320H120Zm80-80h160v-160H200v160Zm320-320v-320h320v320H520Zm80-80h160v-160H600v160Zm160 480v-80h80v80h-80ZM520-360v-80h80v80h-80Zm80 80v-80h80v80h-80Zm-80 80v-80h80v80h-80Zm80 80v-80h80v80h-80Zm80-80v-80h80v80h-80Zm0-160v-80h80v80h-80Zm80 80v-80h80v80h-80Z"/></symbol>
      <symbol id="chevron" viewBox="0 -960 960 960"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></symbol>
      <symbol id="expand-more" viewBox="0 -960 960 960"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></symbol>
      <symbol id="check" viewBox="0 -960 960 960"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></symbol>
      <symbol id="edit" viewBox="0 -960 960 960"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></symbol>
      <symbol id="nav-plus" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol>
    </svg>
    <div class="app">
      <header class="today-header">
        <div class="title-row">
          <button class="today-title" type="button" aria-label="Choose week">
            This Week
            <svg class="icon title-chevron" aria-hidden="true"><use href="#expand-more"/></svg>
          </button>
          <button class="filter-button" type="button" aria-label="App options" aria-haspopup="dialog" aria-expanded="false" aria-controls="app-sidebar">
            <svg class="menu-lines" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5H21M9 16.5H21" vector-effect="non-scaling-stroke"/></svg>
          </button>
        </div>
        <div class="week" aria-label="Weekly activity">
          <button class="day day--complete" type="button" aria-label="Monday, completed" aria-pressed="false">
            <span>M</span>
            <span class="day-circle"><svg class="icon day-plus" aria-hidden="true"><use href="#check"/></svg></span>
          </button>
          <button class="day is-selected" type="button" aria-label="Tuesday" aria-pressed="true">
            <span>T</span>
            <span class="day-circle"><svg class="icon day-plus" aria-hidden="true"><use href="#plus"/></svg></span>
          </button>
          <button class="day" type="button" aria-label="Wednesday" aria-pressed="false">
            <span>W</span>
            <span class="day-circle"></span>
          </button>
          <button class="day" type="button" aria-label="Thursday" aria-pressed="false">
            <span>T</span>
            <span class="day-circle"></span>
          </button>
          <button class="day" type="button" aria-label="Friday" aria-pressed="false">
            <span>F</span>
            <span class="day-circle"></span>
          </button>
          <button class="day" type="button" aria-label="Saturday" aria-pressed="false">
            <span>S</span>
            <span class="day-circle"></span>
          </button>
          <div class="streak" aria-label="1 day streak">
            <svg viewBox="0 0 40 54" aria-hidden="true"><path d="M17 2C18 14 5 21 5 33C5 44 11 51 21 51C31 51 37 44 35 33C34 26 31 20 28 15C28 21 26 24 24 25C25 14 23 7 17 2Z"/><circle cx="21" cy="35" r="11"/><text x="21" y="35">1</text></svg>
          </div>
        </div>
      </header>
      <main class="dashboard">
        <section class="macro-card" aria-labelledby="macro-title">
          <div class="section-heading">
            <div class="macro-heading">
              <h2 id="macro-title">Macros Summary</h2>
              <p class="macro-subtitle">Your daily nutrition</p>
            </div>
            <div class="macro-controls">
              <button class="macro-previous" type="button" disabled aria-label="Previous summary">
                <svg class="icon" aria-hidden="true"><use href="#chevron"/></svg>
              </button>
              <button class="macro-next" type="button" aria-label="Next summary">
                <svg class="icon" aria-hidden="true"><use href="#chevron"/></svg>
              </button>
            </div>
          </div>
          <div class="macros">
            <div class="macro">
              <div class="macro-ring" role="img" aria-label="Carbs: 97.5 of 130 grams">
                <span>97.5g<small>/130</small></span>
              </div>
              <span>Carbs</span>
            </div>
            <div class="macro">
              <div class="macro-ring" role="img" aria-label="Fats: 54 of 72 grams">
                <span>54g<small>/72</small></span>
              </div>
              <span>Fats</span>
            </div>
            <div class="macro">
              <div class="macro-ring" role="img" aria-label="Protein: 75 of 100 grams">
                <span>75g<small>/100</small></span>
              </div>
              <span>Protein</span>
            </div>
          </div>
          <div class="summary-pages" aria-hidden="true">
            <span class="is-active"></span>
            <span></span>
            <span></span>
          </div>
        </section>
        <div class="shortcuts">
          <button class="shortcut" type="button">
            <span>Entry<br>Scan</span>
            <svg class="icon" aria-hidden="true"><use href="#qr"/></svg>
          </button>
          <button class="shortcut" type="button">
            <span>Today’s<br>Specials</span>
            <svg class="icon" aria-hidden="true"><use href="#chef"/></svg>
          </button>
        </div>
        <section class="intake" aria-labelledby="intake-title">
          <div class="section-heading">
            <h2 id="intake-title">Improve Your Intake</h2>
            <button class="text-link" type="button">View Menu</button>
          </div>
          <div class="suggestion">
            <h3>Coconut Curry with Rice</h3>
            <button class="suggestion-edit" type="button" aria-label="Edit suggested meal">
              Suggested
              <svg class="icon" aria-hidden="true"><use href="#edit"/></svg>
            </button>
            <p>High in Carbs and Fibre</p>
            <button class="more-button" type="button" aria-expanded="false" aria-controls="intake-details">
              <span class="more-label">More</span>
              <svg class="icon" aria-hidden="true"><use href="#expand-more"/></svg>
            </button>
          </div>
          <p id="intake-details" class="intake-details" hidden>A balanced suggestion to help you reach your daily carb and fibre goals.</p>
        </section>
        <section class="meals" aria-labelledby="meals-title">
          <div class="section-heading">
            <h2 id="meals-title">Today’s Meals</h2>
            <button class="text-link" type="button">View Diary</button>
          </div>
          <button class="meal-action" type="button">
            <svg class="icon" aria-hidden="true"><use href="#meal"/></svg>
            <span>Add Meal</span>
            <svg class="icon arrow" aria-hidden="true"><use href="#chevron"/></svg>
          </button>
          <button class="meal-action" type="button">
            <svg class="icon" aria-hidden="true"><use href="#cookie"/></svg>
            <span>Add Snack</span>
            <svg class="icon arrow" aria-hidden="true"><use href="#chevron"/></svg>
          </button>
          <button class="meal-action" type="button">
            <svg class="icon" aria-hidden="true"><use href="#drink"/></svg>
            <span>Add a Drink</span>
            <svg class="icon arrow" aria-hidden="true"><use href="#chevron"/></svg>
          </button>
        </section>
      </main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item is-active" type="button" aria-current="page">
          <svg class="icon" aria-hidden="true"><use href="#home"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button">
          <svg class="icon" aria-hidden="true"><use href="#menu"/></svg>
          <span>Menu</span>
        </button>
        <button class="add-button" type="button" aria-label="Add food">
          <svg class="icon" aria-hidden="true"><use href="#nav-plus"/></svg>
          <span>Add</span>
        </button>
        <button class="nav-item" type="button">
          <svg class="icon" aria-hidden="true"><use href="#track"/></svg>
          <span>Track</span>
        </button>
        <button class="nav-item" type="button">
          <svg class="icon" aria-hidden="true"><use href="#social"/></svg>
          <span>Social</span>
        </button>
      </nav>
    </div>
    <dialog id="app-sidebar" class="app-sidebar" aria-labelledby="sidebar-title">
      <div class="sidebar-heading">
        <h2 id="sidebar-title">App options</h2>
        <button class="sidebar-close" type="button" aria-label="Close app options" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
        </button>
      </div>
      <div class="sidebar-display">
        <button class="fullscreen-toggle" type="button" aria-pressed="false" aria-describedby="fullscreen-status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <span class="fullscreen-label">Full screen</span>
        </button>
        <p id="fullscreen-status" class="fullscreen-status" role="status"></p>
      </div>
    </dialog>
  </body>
</html>
