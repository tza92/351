<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#161618">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>iPhone 17 Preview</title>
    <link rel="preload" href="phone/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="phone/styles.css">
    <script src="phone/sidebar.js" defer></script>
  </head>
  <body>
    <main class="stage" aria-label="iPhone 17 preview">
      <div class="device-space">
        <div class="iphone">
          <span class="side-button side-button--action" aria-hidden="true"></span>
          <span class="side-button side-button--volume-up" aria-hidden="true"></span>
          <span class="side-button side-button--volume-down" aria-hidden="true"></span>
          <span class="side-button side-button--right side-button--power" aria-hidden="true"></span>
          <div class="screen" role="region" aria-label="Phone screen">
            <div class="safe-area-top">
              <div class="status-bar">
                <span class="status-time">9:41</span>
                <span class="island" aria-hidden="true"></span>
                <span class="status-icons"><svg class="cellular" viewBox="0 0 18 13" role="img" aria-label="Cellular signal"><rect x="0" y="9" width="3" height="4" rx=".7"/><rect x="5" y="6" width="3" height="7" rx=".7"/><rect x="10" y="3" width="3" height="10" rx=".7"/><rect x="15" width="3" height="13" rx=".7"/></svg><svg class="wifi" viewBox="0 0 20 16" role="img" aria-label="Wi-Fi"><path d="M1.5 4.5a13 13 0 0 1 17 0M4.5 7.5a8.5 8.5 0 0 1 11 0M7.5 10.5a4 4 0 0 1 5 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="13.5" r="1.4"/></svg><span class="battery" role="img" aria-label="Battery full"></span></span>
              </div>
            </div>
            <div class="app-content">
              <iframe class="app-frame" src="app/index.html" allow="fullscreen" title="App preview"></iframe>
            </div>
            <div class="safe-area-bottom">
              <div class="home-indicator" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
